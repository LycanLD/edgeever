name = "luminotes"
main = ".wrangler/edgeever-worker/index.js"
compatibility_date = "2026-06-26"
workers_dev = true
no_bundle = true
find_additional_modules = true
base_dir = ".wrangler/edgeever-worker"

[[rules]]
type = "ESModule"
globs = ["modules/*.js"]
fallthrough = true

[build]
command = "bun scripts/build-cloudflare-worker.mjs"
watch_dir = ["apps/api/src", "packages/shared/src"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/__scheduled"]

[[d1_databases]]
binding = "DB"
database_name = "edgeever"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true

# Fork configuration selected through WRANGLER_CONFIG. The R2 bucket binding is
# intentionally omitted because this Cloudflare account cannot enable R2;
# object storage comes from the instance's external S3-compatible settings and
# the EDGE_EVER_OBJECT_STORAGE_OPTIONAL Worker Secret. Do not add a [vars]
# section here: scripts/run-wrangler.mjs appends one during deploy.
